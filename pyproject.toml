[project]
name = "home-broadband"
version = "1.0.0"
description = "24/7 home broadband throughput, latency and packet-loss monitoring for Raspberry Pi, NVIDIA Jetson, Linux and Windows"
requires-python = ">=3.9"
dependencies = [
    "PyYAML>=6.0",
    "requests>=2.31",
    "dnspython>=2.4",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008", "SIM108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Bare `pytest` (as CI runs it) does not put the repo root on sys.path;
# `python -m pytest` does. Make both find the collector package.
pythonpath = ["."]
addopts = "-q"
