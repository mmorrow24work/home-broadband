name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # One version failing must not cancel the others' results.
      fail-fast: false
      matrix:
        # 3.10 is what a Jetson (Ubuntu 22.04) runs. 3.9 is EOL and no longer
        # offered by the hosted runners; the code itself still supports it.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Lint
        run: ruff check collector tests

      - name: Test
        run: pytest

  windows:
    # The collector runs on Windows 10/11 too: ping.exe, curl.exe, Task Scheduler.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Test
        run: pytest

      - name: Parse the PowerShell installers
        shell: powershell   # Windows PowerShell 5.1, what install-windows.ps1 targets
        run: |
          $failed = $false
          foreach ($f in Get-ChildItem scripts\*.ps1) {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errs) | Out-Null
            foreach ($e in $errs) { Write-Host "$($f.Name):$($e.Extent.StartLineNumber): $($e.Message)"; $failed = $true }
          }
          if ($failed) { exit 1 }
          "PowerShell scripts parse cleanly"

      - name: Live probe smoke test
        run: |
          python -c "from collector import link; print(link.describe())"
          python -c "from collector.probes import ping; r = ping.probe({'name': 'cf', 'host': '1.1.1.1'}, {}); print(r)"

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: ShellCheck the installer
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck -S warning scripts/*.sh

  units:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate systemd units
        run: |
          for unit in systemd/*.service systemd/*.timer; do
            systemd-analyze verify "$unit" 2>&1 \
              | grep -v -e 'Unknown key' -e 'not found' -e 'Failed to prepare' || true
          done
          echo "unit syntax checked"
